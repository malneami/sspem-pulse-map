# المعالجة الآلية للمقاطع المعتمدة: كل ملف مهمة في tools/jobs يتحول إلى مقطع نهائي
# عليه اسم المستشفى والمنطقة وشعار الحملة، ثم تُضاف المشاركة إلى الخريطة.
name: process-videos
on:
  push:
    paths: ["tools/jobs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: process-videos
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin libraqm0 libfribidi0 > /dev/null
          pip install -q pillow
      - name: Fonts (Tajawal, OFL)
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          for w in Medium Bold ExtraBold; do
            curl -sfL -o "$RUNNER_TEMP/fonts/Tajawal-$w.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-$w.ttf"
          done
      - name: Process
        env:
          FONT_DIR: ${{ runner.temp }}/fonts
        run: python3 tools/process_jobs.py
      - name: Publish to the map
        run: |
          git config user.name "pulse-map-bot"
          git config user.email "pulse-map-bot@users.noreply.github.com"
          git add -A media data tools/jobs
          if ! git diff --cached --quiet; then
            git commit -m "Publish processed submissions"
            git pull --rebase
            git push
          fi
